---

# The canary for the pinned images: the same checks as build-libs.yaml and
# lint-reuse.yaml, on the floating `-latest` tags, weekly. Green, the pins
# can be bumped to the commit the provenance step prints; red, the image moved
# under us and nothing pinned is affected yet.

"on":
  # Forgejo only runs a schedule on the default branch.
  schedule:
    # Monday, 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check-firmware-image:
    runs-on: debian
    container:
      image: pnb990/fw-arm-none-eabi-13.2.rel1:ci-latest
    steps:
      # Copy the commit from this log into the `image:` input of
      # build-libs.yaml to bump its pin.
      - name: Image provenance
        run: cat /etc/image-info

      - name: Checkout the repo
        uses: actions/checkout@v6

      # Same build as build-libs.yaml, both compilers in one job: a single
      # result answers a single question, "can the pin be bumped".
      - name: Build
        run: |
          mkdir -p build/top
          cat > build/top/CMakeLists.txt <<'CML'
          cmake_minimum_required(VERSION 3.20)
          project(act_c_packages C)
          set(CMAKE_C_STANDARD 11)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          add_compile_options(-Wall -Wextra -Werror)
          foreach(lib IN ITEMS format syslog)
              add_subdirectory(${SRC}/${lib} ${lib})
          endforeach()
          CML
          for cc in gcc arm-none-eabi-gcc; do
              cmake -S build/top -B build/$cc -G Ninja -DSRC="$PWD" \
                    -DCMAKE_C_COMPILER=$cc \
                    -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
              cmake --build build/$cc
          done

  check-python-image:
    runs-on: debian
    container:
      image: pnb990/python3:ci-latest
    steps:
      # Copy the commit from this log into the `image:` input of
      # lint-reuse.yaml to bump its pin.
      - name: Image provenance
        run: cat /etc/image-info

      - name: Checkout the repo
        uses: actions/checkout@v6

      - name: Check REUSE compliance
        run: uvx reuse lint
